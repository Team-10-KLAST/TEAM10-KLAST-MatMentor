# Builds the API documentation and publishes it to GitHub Pages.
# Runs on every push to main, and can also be started manually from the Actions tab.
name: API docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow's token only gets the rights it needs:
# read the code, write to Pages, and prove its identity to Pages (id-token).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time. A newer run waits
# instead of cancelling a deployment that is already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Delete the committed copy, so we know the file used below
      # was generated by this build and is not an old version.
      - name: Remove the committed OpenAPI document
        run: rm -f docs/Api.json

      # Building the Api project starts the app briefly
      # and writes the OpenAPI document to docs/Api.json.
      - name: Build the Api project
        run: dotnet build Api/Api.csproj

      - name: Check that the OpenAPI document was generated
        run: |
          if [ ! -s docs/Api.json ]; then
            echo "::error::docs/Api.json was not generated by the build"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Turn the OpenAPI document into one static HTML page.
      - name: Build the HTML documentation
        run: npx --yes @redocly/cli@2 build-docs docs/Api.json -o site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Package the site folder so the deploy job can publish it.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
