# Builds the backend and runs the unit tests with code coverage.
# Runs on every pull request to main, so the result shows up on the
# pull request before it is merged, and again after each merge to main.
# Can also be started manually from the Actions tab.
# After a merge to main, it also builds the API image and pushes it to GitHub Container Registry.
name: Build, test and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# The workflow's token only gets the rights it needs: read the code.
permissions:
  contents: read

jobs:
  unit-tests:
    # This name is the status check that main requires.
    # Do not rename it, or pull requests can no longer be merged.
    name: Build and run unit tests
    runs-on: ubuntu-latest
    # Stop the job if it hangs, instead of waiting for the default limit of 6 hours.
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Restore, build and test are separate steps,
      # so the log shows which part failed.
      - name: Restore NuGet packages
        run: dotnet restore MatMentor.slnx

      - name: Build the solution
        run: dotnet build MatMentor.slnx --no-restore

      # Only the unit test project runs here. The integration tests
      # need Docker and are slower, so they will get their own job later.
      # coverlet measures coverage of Domain and Application only, and skips
      # the endpoint files. The Cobertura file is written to TestResults.
      # The options go directly on dotnet test (no "--") because the repo
      # uses Microsoft.Testing.Platform.
      - name: Run the unit tests with coverage
        run: >
          dotnet test --project UnitTests/UnitTests.csproj --no-build
          --results-directory TestResults
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-file-prefix unit-tests
          --coverlet-include "[Domain]*"
          --coverlet-include "[Application]*"
          --coverlet-exclude-by-file "**/*Endpoint.cs"

      # The report steps also run when a test fails, so the coverage
      # report is there when it is needed most. They are skipped if the
      # run is cancelled.
      # Same version as used locally, so the report looks the same.
      - name: Install ReportGenerator
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.6.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Create the coverage report
        if: ${{ !cancelled() }}
        run: >
          reportgenerator
          -reports:"TestResults/unit-tests.coverage.cobertura.*.xml"
          -targetdir:coverage-report
          -reporttypes:"Html;MarkdownSummaryGithub"

      # Shows the short summary directly on the run's Summary page.
      - name: Add the coverage summary to the run
        if: ${{ !cancelled() }}
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # The full HTML report can be downloaded from the run's Summary page.
      - name: Upload the HTML coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/

  integration-tests:
    # This name is a status check that main requires.
    # Do not rename it, or pull requests can no longer be merged.
    name: Build and run integration tests
    runs-on: ubuntu-latest
    # Stop the job if it hangs, instead of waiting for the default limit of 6 hours.
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Each job runs on its own runner, so the integration-project restores and builds too.
      - name: Restore NuGet packages
        run: dotnet restore MatMentor.slnx

      - name: Build the solution
        run: dotnet build MatMentor.slnx --no-restore

      # The tag must match the one in IntegrationTests/TestHelpers/MsSqlFixture.cs.
      - name: Pull the SQL Server image
        run: docker pull mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04

      # Testcontainers uses the Docker engine that is installed on the runner.
      - name: Run the integration tests
        run: dotnet test --project IntegrationTests/IntegrationTests.csproj --no-build

  publish-image:
    # Builds the API image once and pushes it to GitHub Container Registry,
    # so a server can pull and run exactly this build.
    name: Build and push API image
    # Only build an image when both test jobs have passed.
    needs: [unit-tests, integration-tests]
    # Only after a merge to main, never on a pull request. Code that has
    # not been reviewed never gets a token that can write packages.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job may write packages. The test jobs can still only read the code.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # GHCR names must be lowercase, and the owner name has capital letters.
      # The tag is the short commit id, so the tag tells which code the image contains.
      - name: Set the image name and tag
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/matmentor-api" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Uses the workflow's own token, so no personal access token is stored in the repo.
      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # Plain docker commands instead of third-party actions.
      # source links the package to this repository.
      # revision records the full commit id inside the image.
      - name: Build the image
        run: >
          docker build
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          -t "$IMAGE:$TAG" .

      - name: Push the image
        run: docker push "$IMAGE:$TAG"

      # The digest identifies exactly this build. It is shown on the run's
      # Summary page, so it can be compared with the digest on the server.
      # The last line is ready to copy into the server's .env file.
      - name: Add the image and digest to the summary
        run: |
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "- Line for the server's .env: API_IMAGE=$IMAGE:$TAG@${DIGEST#*@}" >> "$GITHUB_STEP_SUMMARY"